<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dental Care — Админ-панель</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f5f7fb 0%, #e8ecf5 100%);
      color: #0f1729;
      min-height: 100vh;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

    /* Login */
    .login {
      max-width: 400px;
      margin: 80px auto;
      background: rgba(255,255,255,.8);
      backdrop-filter: blur(20px);
      padding: 36px;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(91,110,245,.15);
      border: 1px solid rgba(255,255,255,.5);
    }
    .login h2 { font-size: 24px; margin-bottom: 8px; }
    .login p { color: #8893a7; margin-bottom: 20px; font-size: 14px; }
    .login input {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid rgba(0,0,0,.08);
      border-radius: 14px;
      margin-bottom: 14px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
    }
    .login input:focus { border-color: #5b6ef5; box-shadow: 0 0 0 4px rgba(91,110,245,.12); }
    .login button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #5b6ef5, #22d3ee);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }

    /* Panel */
    .panel { display: none; }
    .panel.active { display: block; }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .panel-header h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
    .panel-header .sub { color: #8893a7; font-size: 14px; margin-top: 4px; }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }
    .stat {
      background: rgba(255,255,255,.8);
      backdrop-filter: blur(20px);
      padding: 18px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.5);
      box-shadow: 0 8px 24px rgba(91,110,245,.06);
    }
    .stat .num {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #5b6ef5, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .stat .lbl { font-size: 13px; color: #8893a7; margin-top: 4px; }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 4px;
      background: rgba(255,255,255,.6);
      backdrop-filter: blur(20px);
      padding: 6px;
      border-radius: 16px;
      margin-bottom: 20px;
      overflow-x: auto;
      border: 1px solid rgba(255,255,255,.5);
    }
    .tab {
      padding: 10px 16px;
      background: none;
      border: none;
      color: #8893a7;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 12px;
      white-space: nowrap;
      font-family: inherit;
      transition: all .2s;
    }
    .tab.active {
      background: linear-gradient(135deg, #5b6ef5, #22d3ee);
      color: #fff;
      font-weight: 600;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Cards */
    .card-panel {
      background: rgba(255,255,255,.8);
      backdrop-filter: blur(20px);
      border-radius: 18px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,.5);
      box-shadow: 0 8px 24px rgba(91,110,245,.06);
      margin-bottom: 16px;
    }

    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .filters input, .filters select {
      padding: 10px 14px;
      border: 1.5px solid rgba(0,0,0,.08);
      border-radius: 12px;
      font-size: 14px;
      background: rgba(255,255,255,.8);
      font-family: inherit;
      outline: none;
    }
    .filters input:focus, .filters select:focus { border-color: #5b6ef5; }
    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all .15s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: linear-gradient(135deg, #5b6ef5, #22d3ee); color: #fff; }
    .btn-secondary { background: rgba(0,0,0,.05); color: #0f1729; }
    .btn-danger { background: rgba(239,68,68,.12); color: #ef4444; }
    .btn-success { background: rgba(16,185,129,.12); color: #10b981; }

    /* Booking row */
    .booking {
      padding: 16px;
      background: rgba(255,255,255,.6);
      border-radius: 14px;
      margin-bottom: 10px;
      border-left: 4px solid #5b6ef5;
    }
    .booking.cancelled { border-left-color: #ef4444; opacity: .7; }
    .booking .b-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge.confirmed { background: rgba(16,185,129,.15); color: #10b981; }
    .badge.cancelled { background: rgba(239,68,68,.15); color: #ef4444; }
    .booking .b-info { font-size: 13px; color: #555; line-height: 1.7; }
    .booking .b-actions { display: flex; gap: 8px; margin-top: 12px; }

    /* Item row (service/doctor) */
    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px;
      background: rgba(255,255,255,.6);
      border-radius: 14px;
      margin-bottom: 8px;
    }
    .item-row .main { display: flex; gap: 12px; align-items: center; flex: 1; }
    .item-row .icon {
      width: 40px; height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(91,110,245,.15), rgba(34,211,238,.15));
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .item-row .name { font-weight: 600; }
    .item-row .meta { font-size: 12px; color: #8893a7; margin-top: 2px; }
    .item-row .actions { display: flex; gap: 6px; }
    .icon-btn {
      width: 32px; height: 32px;
      border: none;
      border-radius: 10px;
      background: rgba(0,0,0,.05);
      cursor: pointer;
      font-size: 14px;
    }
    .icon-btn:hover { background: rgba(0,0,0,.1); }

    /* Form */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .form-grid .full { grid-column: 1/-1; }
    .form-grid input, .form-grid textarea, .form-grid select {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid rgba(0,0,0,.08);
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      background: rgba(255,255,255,.8);
    }
    .form-grid input:focus, .form-grid textarea:focus { border-color: #5b6ef5; }
    .form-grid label { font-size: 13px; font-weight: 500; color: #555; }

    /* Chart */
    .chart-container {
      background: rgba(255,255,255,.8);
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 16px;
    }
    .chart-container h3 { font-size: 16px; margin-bottom: 12px; }

    /* Review */
    .review-row {
      padding: 14px;
      background: rgba(255,255,255,.6);
      border-radius: 14px;
      margin-bottom: 8px;
    }
    .review-row .r-head { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .review-row .r-stars { color: #fbbf24; font-size: 16px; }
    .review-row .r-text { font-size: 14px; color: #333; margin-top: 4px; }
    .review-row .r-meta { font-size: 12px; color: #8893a7; margin-top: 6px; }

    .logout {
      margin-top: 24px;
      padding: 12px;
      background: rgba(0,0,0,.05);
      border: none;
      border-radius: 12px;
      width: 100%;
      cursor: pointer;
      color: #8893a7;
      font-family: inherit;
      font-size: 14px;
    }

    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15,23,41,.5);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: #fff;
      padding: 24px;
      border-radius: 20px;
      width: 90%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-content h3 { margin-bottom: 16px; }
    .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
    .modal-actions button { flex: 1; }
  </style>
</head>
<body>

  <!-- Login -->
  <div id="login-screen" class="login">
    <h2>🔐 Админ-панель</h2>
    <p>Dental Care — управление клиникой</p>
    <input type="password" id="admin-password" placeholder="Пароль" autocomplete="current-password">
    <button onclick="tryLogin()">Войти</button>
  </div>

  <!-- Panel -->
  <div id="admin-panel" class="panel">
    <div class="container">
      <div class="panel-header">
        <div>
          <h1>🦷 Dental Care Admin</h1>
          <div class="sub">Управление клиникой</div>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><div class="num" id="stat-total">0</div><div class="lbl">Всего записей</div></div>
        <div class="stat"><div class="num" id="stat-today">0</div><div class="lbl">Сегодня</div></div>
        <div class="stat"><div class="num" id="stat-week">0</div><div class="lbl">За 7 дней</div></div>
        <div class="stat"><div class="num" id="stat-clients">0</div><div class="lbl">Клиентов</div></div>
        <div class="stat"><div class="num" id="stat-reviews">0</div><div class="lbl">Отзывов</div></div>
        <div class="stat"><div class="num" id="stat-rating">0</div><div class="lbl">Средняя оценка</div></div>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="bookings">📋 Записи</button>
        <button class="tab" data-tab="users">👥 Клиенты</button>
        <button class="tab" data-tab="services">🦷 Услуги</button>
        <button class="tab" data-tab="doctors">👨‍⚕️ Врачи</button>
        <button class="tab" data-tab="reviews">⭐ Отзывы</button>
        <button class="tab" data-tab="analytics">📈 Аналитика</button>
      </div>

      <!-- ЗАПИСИ -->
      <div id="tab-bookings" class="tab-content active">
        <div class="card-panel">
          <div class="filters">
            <input type="date" id="filter-date">
            <select id="filter-status">
              <option value="">Все статусы</option>
              <option value="confirmed">Подтверждённые</option>
              <option value="cancelled">Отменённые</option>
            </select>
            <button class="btn btn-primary" onclick="loadBookings()">Применить</button>
          </div>
          <div id="bookings-list"></div>
        </div>
      </div>

      <!-- КЛИЕНТЫ -->
      <div id="tab-users" class="tab-content">
        <div class="card-panel">
          <div id="users-list"></div>
        </div>
      </div>

      <!-- УСЛУГИ -->
      <div id="tab-services" class="tab-content">
        <div class="card-panel">
          <button class="btn btn-primary" onclick="openServiceModal()">+ Добавить услугу</button>
          <div id="services-list" style="margin-top:14px"></div>
        </div>
      </div>

      <!-- ВРАЧИ -->
      <div id="tab-doctors" class="tab-content">
        <div class="card-panel">
          <button class="btn btn-primary" onclick="openDoctorModal()">+ Добавить врача</button>
          <div id="doctors-list" style="margin-top:14px"></div>
        </div>
      </div>

      <!-- ОТЗЫВЫ -->
      <div id="tab-reviews" class="tab-content">
        <div class="card-panel">
          <div id="reviews-list"></div>
        </div>
      </div>

      <!-- АНАЛИТИКА -->
      <div id="tab-analytics" class="tab-content">
        <div class="chart-container">
          <h3>📈 Записи за последние 14 дней</h3>
          <canvas id="chart-bookings" height="100"></canvas>
        </div>
        <div class="chart-container">
          <h3>🦷 Популярные услуги</h3>
          <canvas id="chart-services" height="100"></canvas>
        </div>
        <div class="chart-container">
          <h3>👨‍⚕️ Загрузка врачей</h3>
          <canvas id="chart-doctors" height="100"></canvas>
        </div>
      </div>

      <button class="logout" onclick="logout()">Выйти</button>
    </div>
  </div>

  <!-- Модалка услуги/врача -->
  <div id="item-modal" class="modal">
    <div class="modal-content">
      <h3 id="modal-title">Добавить</h3>
      <div id="modal-form"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
        <button class="btn btn-primary" onclick="saveItem()">Сохранить</button>
      </div>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>

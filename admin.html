<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dental Care — Админ-панель</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #f5f7fb 0%, #e8ecf5 100%);
      color: #0f1729;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ====== AURORA BACKGROUND ====== */
    .aurora {
      position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0;
    }
    .aurora-blob {
      position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.35;
      animation: float 25s ease-in-out infinite;
    }
    .blob-1 { width: 500px; height: 500px; background: linear-gradient(135deg, #5b6ef5, #22d3ee); top: -150px; left: -150px; }
    .blob-2 { width: 400px; height: 400px; background: linear-gradient(135deg, #f472b6, #a78bfa); top: 40%; right: -150px; animation-delay: -8s; }
    .blob-3 { width: 350px; height: 350px; background: linear-gradient(135deg, #22d3ee, #10b981); bottom: -100px; left: 30%; animation-delay: -15s; }
    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(50px, -40px) scale(1.1); }
      66% { transform: translate(-40px, 50px) scale(0.95); }
    }

    .container { max-width: 1200px; margin: 0 auto; padding: 24px; position: relative; z-index: 1; }

    /* ====== LOGIN ====== */
    .login {
      max-width: 420px; margin: 80px auto;
      background: rgba(255,255,255,.85);
      backdrop-filter: blur(20px);
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(91,110,245,.15);
      border: 1px solid rgba(255,255,255,.5);
    }
    .login-logo {
      width: 80px; height: 80px; margin: 0 auto 20px;
      background: linear-gradient(135deg, #5b6ef5, #22d3ee);
      border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px;
      box-shadow: 0 10px 30px rgba(91,110,245,.3);
    }
    .login h2 { font-size: 26px; font-weight: 800; margin-bottom: 8px; text-align: center; }
    .login p { color: #8893a7; margin-bottom: 24px; font-size: 14px; text-align: center; }
    .login input {
      width: 100%; padding: 14px 16px;
      border: 1.5px solid rgba(0,0,0,.08);
      border-radius: 14px; margin-bottom: 14px;
      font-size: 15px; font-family: inherit; outline: none;
      background: rgba(255,255,255,.8);
      transition: all .2s;
    }
    .login input:focus { border-color: #5b6ef5; box-shadow: 0 0 0 4px rgba(91,110,245,.12); }
    .login button {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #5b6ef5, #22d3ee);
      color: #fff; border: none; border-radius: 14px;
      font-size: 15px; font-weight: 600; cursor: pointer;
      font-family: inherit;
      box-shadow: 0 8px 24px rgba(91,110,245,.35);
      transition: all .15s;
    }
    .login button:active { transform: translateY(2px); box-shadow: 0 4px 12px rgba(91,110,245,.3); }

    /* ====== PANEL ====== */
    .panel { display: none; }
    .panel.active { display: block; }
    .panel-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
    }
    .panel-header h1 {
      font-size: 28px; font-weight: 800; letter-spacing: -0.02em;
      background: linear-gradient(135deg, #5b6ef5, #22d3ee);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .panel-header .sub { color: #8893a7; font-size: 14px; margin-top: 4px; }

    /* ====== STATS ====== */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 14px; margin-bottom: 24px;
    }
    .stat {
      background: rgba(255,255,255,.8);
      backdrop-filter: blur(20px);
      padding: 18px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.5);
      box-shadow: 0 8px 24px rgba(91,110,245,.06);
      transition: transform .2s;
    }
    .stat:hover { transform: translateY(-2px); }
    .stat .num {
      font-size: 28px; font-weight: 800;
      background: linear-gradient(135deg, #5b6ef5, #22d3ee);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .stat .lbl { font-size: 13px; color: #8893a7; margin-top: 4px; }

    /* ====== TABS ====== */
    .tabs {
      display: flex; gap: 4px;
      background: rgba(255,255,255,.6);
      backdrop-filter: blur(20px);
      padding: 6px; border-radius: 16px;
      margin-bottom: 20px;
      overflow-x: auto;
      border: 1px solid rgba(255,255,255,.5);
    }
    .tab {
      padding: 10px 16px; background: none; border: none;
      color: #8893a7; font-size: 14px; font-weight: 500;
      cursor: pointer; border-radius: 12px;
      white-space: nowrap; font-family: inherit;
      transition: all .2s;
    }
    .tab:hover { color: #5b6ef5; }
    .tab.active {
      background: linear-gradient(135deg, #5b6ef5, #22d3ee);
      color: #fff; font-weight: 600;
      box-shadow: 0 4px 12px rgba(91,110,245,.3);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn .3s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* ====== CARD PANEL ====== */
    .card-panel {
      background: rgba(255,255,255,.8);
      backdrop-filter: blur(20px);
      border-radius: 18px; padding: 20px;
      border: 1px solid rgba(255,255,255,.5);
      box-shadow: 0 8px 24px rgba(91,110,245,.06);
      margin-bottom: 16px;
    }

    /* ====== FILTERS ====== */
    .filters { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .filters input, .filters select {
      padding: 10px 14px;
      border: 1.5px solid rgba(0,0,0,.08);
      border-radius: 12px; font-size: 14px;
      background: rgba(255,255,255,.8);
      font-family: inherit; outline: none;
    }
    .filters input:focus, .filters select:focus { border-color: #5b6ef5; }

    /* ====== BUTTONS ====== */
    .btn {
      padding: 10px 18px; border: none; border-radius: 12px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      font-family: inherit; transition: all .15s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary {
      background: linear-gradient(135deg, #5b6ef5, #22d3ee);
      color: #fff; box-shadow: 0 4px 12px rgba(91,110,245,.3);
    }
    .btn-secondary { background: rgba(0,0,0,.05); color: #0f1729; }
    .btn-danger { background: rgba(239,68,68,.12); color: #ef4444; }
    .btn-success { background: rgba(16,185,129,.12); color: #10b981; }
    .btn-warning { background: rgba(245,158,11,.12); color: #d97706; }

    /* ====== BOOKING ROW ====== */
    .booking {
      padding: 16px; background: rgba(255,255,255,.6);
      border-radius: 14px; margin-bottom: 10px;
      border-left: 4px solid #5b6ef5;
      transition: all .2s;
    }
    .booking:hover { transform: translateX(2px); }
    .booking.cancelled { border-left-color: #ef4444; opacity: .7; }
    .booking .b-head {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 8px;
    }
    .badge {
      padding: 4px 10px; border-radius: 20px;
      font-size: 12px; font-weight: 600;
    }
    .badge.confirmed { background: rgba(16,185,129,.15); color: #10b981; }
    .badge.cancelled { background: rgba(239,68,68,.15); color: #ef4444; }
    .booking .b-info { font-size: 13px; color: #555; line-height: 1.7; }
    .booking .b-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

    /* ====== ITEM ROW ====== */
    .item-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px; background: rgba(255,255,255,.6);
      border-radius: 14px; margin-bottom: 8px;
      transition: all .2s;
    }
    .item-row:hover { background: rgba(255,255,255,.8); }
    .item-row .main { display: flex; gap: 12px; align-items: center; flex: 1; min-width: 0; }
    .item-row .icon {
      width: 44px; height: 44px; border-radius: 12px;
      background: linear-gradient(135deg, rgba(91,110,245,.15), rgba(34,211,238,.15));
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
    }
    .item-row .name { font-weight: 600; }
    .item-row .meta { font-size: 12px; color: #8893a7; margin-top: 2px; }
    .item-row .actions { display: flex; gap: 6px; flex-shrink: 0; }
    .icon-btn {
      width: 34px; height: 34px; border: none;
      border-radius: 10px; background: rgba(0,0,0,.05);
      cursor: pointer; font-size: 14px;
      transition: all .15s;
    }
    .icon-btn:hover { background: rgba(0,0,0,.1); transform: scale(1.05); }

    /* ====== FORM ====== */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-grid .full { grid-column: 1/-1; }
    .form-grid input, .form-grid textarea, .form-grid select {
      width: 100%; padding: 11px 14px;
      border: 1.5px solid rgba(0,0,0,.08);
      border-radius: 12px; font-size: 14px;
      font-family: inherit; outline: none;
      background: rgba(255,255,255,.8);
    }
    .form-grid input:focus, .form-grid textarea:focus, .form-grid select:focus {
      border-color: #5b6ef5;
    }
    .form-grid label { font-size: 13px; font-weight: 500; color: #555; display: block; margin-bottom: 4px; }

    /* ====== CHART ====== */
    .chart-container {
      background: rgba(255,255,255,.8);
      backdrop-filter: blur(20px);
      padding: 20px; border-radius: 18px;
      margin-bottom: 16px;
      border: 1px solid rgba(255,255,255,.5);
      box-shadow: 0 8px 24px rgba(91,110,245,.06);
    }
    .chart-container h3 { font-size: 16px; margin-bottom: 12px; font-weight: 700; }

    /* ====== REVIEW ====== */
    .review-row {
      padding: 14px; background: rgba(255,255,255,.6);
      border-radius: 14px; margin-bottom: 8px;
    }
    .review-row .r-head { display: flex; justify-content: space-between; margin-bottom: 6px; align-items: center; }
    .review-row .r-stars { color: #fbbf24; font-size: 16px; }
    .review-row .r-text { font-size: 14px; color: #333; margin-top: 4px; }
    .review-row .r-meta { font-size: 12px; color: #8893a7; margin-top: 6px; }
    .review-row .r-actions { margin-top: 10px; display: flex; gap: 6px; }

    /* ====== LOGOUT ====== */
    .logout {
      margin-top: 24px; padding: 12px;
      background: rgba(0,0,0,.05); border: none;
      border-radius: 12px; width: 100%;
      cursor: pointer; color: #8893a7;
      font-family: inherit; font-size: 14px;
      transition: all .2s;
    }
    .logout:hover { background: rgba(239,68,68,.1); color: #ef4444; }

    /* ====== MODAL ====== */
    .modal {
      position: fixed; inset: 0;
      background: rgba(15,23,41,.5);
      backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center;
      z-index: 100;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: #fff; padding: 24px;
      border-radius: 20px; width: 90%; max-width: 520px;
      max-height: 90vh; overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
      animation: modalIn .3s cubic-bezier(.2,.9,.3,1.2);
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(.9) translateY(20px); }
      to { opacity: 1; transform: none; }
    }
    .modal-content h3 { margin-bottom: 16px; font-size: 20px; }
    .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
    .modal-actions button { flex: 1; }

    /* ====== TOAST ====== */
    .toast {
      position: fixed; top: 20px; left: 50%;
      transform: translateX(-50%);
      background: rgba(15,23,41,.9);
      backdrop-filter: blur(20px);
      color: #fff; padding: 12px 20px;
      border-radius: 14px; font-size: 14px; font-weight: 500;
      z-index: 1000;
      animation: toastIn .3s cubic-bezier(.2,.9,.3,1.2);
      max-width: 90%; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translate(-50%, -20px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    /* ====== RESPONSIVE ====== */
    @media (max-width: 640px) {
      .container { padding: 16px; }
      .panel-header h1 { font-size: 22px; }
      .form-grid { grid-template-columns: 1fr; }
      .stats { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <!-- AURORA BACKGROUND -->
  <div class="aurora">
    <div class="aurora-blob blob-1"></div>
    <div class="aurora-blob blob-2"></div>
    <div class="aurora-blob blob-3"></div>
  </div>

  <!-- ====== LOGIN SCREEN ====== -->
  <div id="login-screen" class="login">
    <div class="login-logo">🦷</div>
    <h2>Админ-панель</h2>
    <p>Dental Care — управление клиникой</p>
    <input type="password" id="admin-password" placeholder="Пароль" autocomplete="current-password">
    <button onclick="tryLogin()">Войти</button>
  </div>

  <!-- ====== ADMIN PANEL ====== -->
  <div id="admin-panel" class="panel">
    <div class="container">
      <div class="panel-header">
        <div>
          <h1>🦷 Dental Care Admin</h1>
          <div class="sub">Управление клиникой</div>
        </div>
      </div>

      <!-- STATS -->
      <div class="stats">
        <div class="stat"><div class="num" id="stat-total">0</div><div class="lbl">Всего записей</div></div>
        <div class="stat"><div class="num" id="stat-today">0</div><div class="lbl">Сегодня</div></div>
        <div class="stat"><div class="num" id="stat-week">0</div><div class="lbl">За 7 дней</div></div>
        <div class="stat"><div class="num" id="stat-clients">0</div><div class="lbl">Клиентов</div></div>
        <div class="stat"><div class="num" id="stat-reviews">0</div><div class="lbl">Отзывов</div></div>
        <div class="stat"><div class="num" id="stat-rating">—</div><div class="lbl">Средняя оценка</div></div>
      </div>

      <!-- TABS -->
      <div class="tabs">
        <button class="tab active" data-tab="bookings">📋 Записи</button>
        <button class="tab" data-tab="users">👥 Клиенты</button>
        <button class="tab" data-tab="services">🦷 Услуги</button>
        <button class="tab" data-tab="doctors">👨‍⚕️ Врачи</button>
        <button class="tab" data-tab="promos">🎁 Акции</button>
        <button class="tab" data-tab="portfolio">🖼 Галерея</button>
        <button class="tab" data-tab="reviews">⭐ Отзывы</button>
        <button class="tab" data-tab="analytics">📈 Аналитика</button>
      </div>

      <!-- ====== TAB: ЗАПИСИ ====== -->
      <div id="tab-bookings" class="tab-content active">
        <div class="card-panel">
          <div class="filters">
            <input type="date" id="filter-date">
            <select id="filter-status">
              <option value="">Все статусы</option>
              <option value="confirmed">Подтверждённые</option>
              <option value="cancelled">Отменённые</option>
            </select>
            <button class="btn btn-primary" onclick="loadBookings()">Применить</button>
          </div>
          <div id="bookings-list"></div>
        </div>
      </div>

      <!-- ====== TAB: КЛИЕНТЫ ====== -->
      <div id="tab-users" class="tab-content">
        <div class="card-panel">
          <div id="users-list"></div>
        </div>
      </div>

      <!-- ====== TAB: УСЛУГИ ====== -->
      <div id="tab-services" class="tab-content">
        <div class="card-panel">
          <button class="btn btn-primary" onclick="openServiceModal()">+ Добавить услугу</button>
          <div id="services-list" style="margin-top:14px"></div>
        </div>
      </div>

      <!-- ====== TAB: ВРАЧИ ====== -->
      <div id="tab-doctors" class="tab-content">
        <div class="card-panel">
          <button class="btn btn-primary" onclick="openDoctorModal()">+ Добавить врача</button>
          <div id="doctors-list" style="margin-top:14px"></div>
        </div>
      </div>

      <!-- ====== TAB: АКЦИИ ====== -->
      <div id="tab-promos" class="tab-content">
        <div class="card-panel">
          <button class="btn btn-primary" onclick="openPromoModal()">+ Добавить акцию</button>
          <div id="promos-list-admin" style="margin-top:14px"></div>
        </div>
      </div>

      <!-- ====== TAB: ГАЛЕРЕЯ ====== -->
      <div id="tab-portfolio" class="tab-content">
        <div class="card-panel">
          <div class="filters">
            <select id="portfolio-doctor-filter" onchange="loadPortfolio()">
              <option value="">Загрузка...</option>
            </select>
            <button class="btn btn-primary" onclick="document.getElementById('portfolio-upload').click()">+ Загрузить фото</button>
            <input type="file" id="portfolio-upload" accept="image/*" style="display:none" onchange="uploadPortfolioPhoto(event)">
          </div>
          <div id="portfolio-list-admin"></div>
        </div>
      </div>

      <!-- ====== TAB: ОТЗЫВЫ ====== -->
      <div id="tab-reviews" class="tab-content">
        <div class="card-panel">
          <div id="reviews-list"></div>
        </div>
      </div>

      <!-- ====== TAB: АНАЛИТИКА ====== -->
      <div id="tab-analytics" class="tab-content">
        <div class="chart-container">
          <h3>📈 Записи за последние 14 дней</h3>
          <canvas id="chart-bookings" height="100"></canvas>
        </div>
        <div class="chart-container">
          <h3>🦷 Популярные услуги</h3>
          <canvas id="chart-services" height="100"></canvas>
        </div>
        <div class="chart-container">
          <h3>👨‍⚕️ Загрузка врачей</h3>
          <canvas id="chart-doctors" height="100"></canvas>
        </div>
      </div>

      <button class="logout" onclick="logout()">Выйти из аккаунта</button>
    </div>
  </div>

  <!-- ====== MODAL: ITEM ====== -->
  <div id="item-modal" class="modal">
    <div class="modal-content">
      <h3 id="modal-title">Добавить</h3>
      <div id="modal-form"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
        <button class="btn btn-primary" onclick="saveItem()">Сохранить</button>
      </div>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>

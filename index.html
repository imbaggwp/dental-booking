                        <body>
                            <!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Dental Booking Pro</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #000000);
    --btn: var(--tg-theme-button-color, #3390ec);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --secondary: var(--tg-theme-secondary-bg-color, #f4f4f5);
    --hint: var(--tg-theme-hint-color, #999999);
    --link: var(--tg-theme-link-color, #3390ec);
    --danger: #ff3b30;
    --success: #34c759;
    --warning: #ff9500;
    --border: rgba(0,0,0,0.08);
  }
  [data-theme="dark"] {
    --bg: #1c1c1e; --text: #ffffff; --secondary: #2c2c2e;
    --hint: #8e8e93; --border: rgba(255,255,255,0.08);
  }
  [data-theme="light"] {
    --bg: #ffffff; --text: #000000; --secondary: #f4f4f5;
    --hint: #999999; --border: rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; overflow-x: hidden; width: 100%;
  }
  body {
    min-height: 100vh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #root { width: 100%; min-height: 100vh; display: flex; flex-direction: column; }
  .app {
    width: 100%; max-width: 480px; margin: 0 auto;
    padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom));
    flex: 1; display: flex; flex-direction: column;
    position: relative;
  }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 8px; }
  .header-left, .header-right { display: flex; align-items: center; gap: 6px; }
  .header-title { font-weight: 700; font-size: 16px; text-align: center; flex: 1; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%; background: var(--secondary);
    border: none; display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text); font-size: 16px;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .icon-btn:active { transform: scale(0.92); }
  .back-btn {
    width: 36px; height: 36px; border-radius: 50%; background: var(--secondary);
    border: none; display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .back-btn:active { transform: scale(0.9); }
  .back-btn svg { transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .back-btn:hover svg { transform: translateX(-3px); }
  .back-btn:active svg { transform: translateX(-5px); }
  .lang-switch { display: flex; gap: 2px; background: var(--secondary); border-radius: 18px; padding: 2px; }
  .lang-btn {
    padding: 5px 10px; border: none; background: transparent;
    color: var(--hint); font-size: 12px; font-weight: 600; border-radius: 16px; cursor: pointer;
  }
  .lang-btn.active { background: var(--bg); color: var(--text); }
  .hero {
    width: 100%; height: 180px; border-radius: 20px; overflow: hidden;
    margin-bottom: 16px; position: relative;
    background: linear-gradient(135deg, #3390ec 0%, #1e6fd9 100%);
  }
  [data-theme="dark"] .hero { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); }
  .hero-pattern {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle at 20% 30%, rgba(255,255,255,0.15) 0%, transparent 50%),
                      radial-gradient(circle at 80% 70%, rgba(255,255,255,0.1) 0%, transparent 50%);
  }
  .hero-content {
    position: absolute; inset: 0; padding: 20px;
    display: flex; flex-direction: column; justify-content: space-between; color: white;
  }
  .hero-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .hero-logo { font-size: 28px; }
  .hero-badge {
    background: rgba(255,255,255,0.2); backdrop-filter: blur(10px);
    padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600;
  }
  .hero-bottom h1 { margin: 0; font-size: 22px; font-weight: 700; }
  .hero-bottom p { margin: 4px 0 0; font-size: 13px; opacity: 0.9; }
  .user-card {
    display: flex; align-items: center; gap: 12px;
    padding: 14px; background: var(--secondary); border-radius: 16px; margin-bottom: 16px;
  }
  .avatar {
    width: 48px; height: 48px; border-radius: 50%; background: var(--btn); color: var(--btn-text);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 18px; flex-shrink: 0; overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .user-info { flex: 1; min-width: 0; }
  .user-name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user-sub { font-size: 12px; color: var(--hint); margin-top: 2px; }
  .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .menu-btn {
    padding: 18px 12px; background: var(--secondary); border: none;
    border-radius: 16px; color: var(--text); font-size: 13px; font-weight: 600;
    cursor: pointer; display: flex; flex-direction: column; align-items: center;
    gap: 8px; text-align: center;
  }
  .menu-btn:active { transform: scale(0.97); }
  .menu-btn svg { width: 32px; height: 32px; }
  .menu-btn.primary { background: var(--btn); color: var(--btn-text); }
  .menu-btn.full { grid-column: span 2; }
  .section-title { font-size: 17px; font-weight: 700; margin: 8px 0 12px; }
  .services-list { display: flex; flex-direction: column; gap: 10px; }
  .service-card {
    padding: 14px; background: var(--secondary); border-radius: 14px;
    display: flex; align-items: center; gap: 12px; cursor: pointer;
    border: 2px solid transparent;
  }
  .service-card.selected { border-color: var(--btn); background: rgba(51,144,236,0.1); }
  .service-icon {
    width: 44px; height: 44px; border-radius: 12px; background: var(--bg);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .service-icon svg { width: 24px; height: 24px; }
  .service-info { flex: 1; min-width: 0; }
  .service-name { font-weight: 600; font-size: 14px; }
  .service-meta { font-size: 12px; color: var(--hint); margin-top: 2px; }
  .doctors-list { display: flex; flex-direction: column; gap: 10px; }
  .doctor-card {
    padding: 14px; background: var(--secondary); border-radius: 16px;
    display: flex; gap: 12px; cursor: pointer; border: 2px solid transparent;
  }
  .doctor-card.selected { border-color: var(--btn); }
  .doctor-avatar {
    width: 64px; height: 64px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 22px; color: white; flex-shrink: 0;
  }
  .doctor-info { flex: 1; min-width: 0; }
  .doctor-name { font-weight: 700; font-size: 15px; margin-bottom: 2px; }
  .doctor-spec { font-size: 12px; color: var(--hint); margin-bottom: 6px; }
  .doctor-rating { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; }
  .doctor-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .doctor-tag {
    font-size: 10px; padding: 2px 8px; border-radius: 8px;
    background: var(--bg); color: var(--hint); font-weight: 500;
  }
  .calendar { background: var(--secondary); border-radius: 16px; padding: 16px; }
  .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .cal-title { font-weight: 600; font-size: 15px; text-transform: capitalize; }
  .cal-nav {
    width: 32px; height: 32px; border-radius: 50%; background: var(--bg);
    border: none; cursor: pointer; color: var(--text); font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .cal-nav:active { transform: scale(0.9); }
  .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 8px; }
  .cal-weekday { text-align: center; font-size: 11px; color: var(--hint); font-weight: 600; padding: 4px; }
  .cal-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-day {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    border-radius: 50%; font-size: 13px; cursor: pointer;
    background: transparent; border: none; color: var(--text);
  }
  .cal-day:disabled { color: var(--hint); opacity: 0.3; cursor: not-allowed; }
  .cal-day.selected { background: var(--btn); color: var(--btn-text); font-weight: 700; }
  .cal-day.today { border: 2px solid var(--btn); }
  .cal-day.blocked { background: repeating-linear-gradient(45deg, transparent, transparent 3px, var(--hint) 3px, var(--hint) 4px); opacity: 0.3; }
  .time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .time-slot {
    padding: 14px 8px; background: var(--secondary); border: 2px solid transparent;
    border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; color: var(--text);
  }
  .time-slot:disabled { opacity: 0.4; cursor: not-allowed; text-decoration: line-through; }
  .time-slot.selected { border-color: var(--btn); background: rgba(51,144,236,0.1); color: var(--btn); }
  .confirm-card { background: var(--secondary); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
  .confirm-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--border); gap: 12px;
  }
  .confirm-row:last-child { border-bottom: none; }
  .confirm-label { font-size: 13px; color: var(--hint); }
  .confirm-value { font-weight: 600; font-size: 14px; text-align: right; }
  .success-icon {
    width: 80px; height: 80px; border-radius: 50%; background: var(--success);
    color: white; display: flex; align-items: center; justify-content: center;
    margin: 20px auto; animation: pop 0.4s ease;
  }
  @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.1); } 100% { transform: scale(1); } }
  .success-icon svg { width: 40px; height: 40px; }
  .success-text { text-align: center; font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .success-sub { text-align: center; color: var(--hint); font-size: 14px; margin-bottom: 24px; }
  .appt-card {
    background: var(--secondary); border-radius: 14px; padding: 14px;
    margin-bottom: 10px; border-left: 4px solid var(--btn);
  }
  .appt-card.cancelled { border-left-color: var(--danger); opacity: 0.7; }
  .appt-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .appt-service { font-weight: 700; font-size: 14px; }
  .appt-status {
    font-size: 11px; padding: 3px 8px; border-radius: 10px;
    background: var(--success); color: white; font-weight: 600;
  }
  .appt-status.cancelled { background: var(--danger); }
  .appt-details { font-size: 13px; color: var(--hint); display: flex; gap: 12px; flex-wrap: wrap; }
  .appt-doctor { font-size: 12px; color: var(--link); margin-top: 4px; font-weight: 500; }
  .appt-cancel-reason { font-size: 11px; color: var(--danger); margin-top: 4px; font-style: italic; }
  .appt-actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-small {
    padding: 7px 12px; border-radius: 8px; border: none;
    font-size: 12px; font-weight: 600; cursor: pointer;
    background: var(--bg); color: var(--text);
    display: inline-flex; align-items: center; gap: 4px;
    transition: all 0.15s;
  }
  .btn-small:active { transform: scale(0.95); }
  .btn-small.danger { background: var(--danger); color: white; }
  .btn-small.primary { background: var(--btn); color: var(--btn-text); }
  .btn-small.success { background: var(--success); color: white; }
  .btn-small.active { background: var(--btn); color: var(--btn-text); }
  .btn-small.ghost { background: transparent; border: 1px solid var(--border); }
  .btn-small.warning { background: var(--warning); color: white; }
  .btn-small svg { width: 14px; height: 14px; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--hint); }
  .empty-icon { margin-bottom: 12px; }
  .empty-icon svg { width: 48px; height: 48px; opacity: 0.5; }
  .tabs {
    display: flex; gap: 4px; background: var(--secondary);
    border-radius: 12px; padding: 4px; margin-bottom: 16px;
    overflow-x: auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    padding: 9px 12px; border: none; background: transparent;
    border-radius: 8px; font-size: 12px; font-weight: 600;
    cursor: pointer; color: var(--hint); white-space: nowrap; flex-shrink: 0;
  }
  .tab.active { background: var(--bg); color: var(--text); }
  .admin-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .stat-card { background: var(--secondary); border-radius: 14px; padding: 14px; }
  .stat-value { font-size: 24px; font-weight: 700; color: var(--btn); }
  .stat-label { font-size: 12px; color: var(--hint); margin-top: 4px; }
  .search-box {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: none;
    background: var(--secondary); color: var(--text); font-size: 14px;
    margin-bottom: 12px; outline: none;
  }
  .search-box::placeholder { color: var(--hint); }
  .fade-in { animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .step-indicator { display: flex; gap: 6px; margin-bottom: 16px; }
  .step-dot { flex: 1; height: 4px; border-radius: 2px; background: var(--secondary); }
  .step-dot.active { background: var(--btn); }
  .step-dot.done { background: var(--success); }
  .profile-form { display: flex; flex-direction: column; gap: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-label { font-size: 12px; color: var(--hint); font-weight: 600; }
  .form-input {
    padding: 12px 14px; border-radius: 12px; border: none;
    background: var(--secondary); color: var(--text); font-size: 14px;
    outline: none; width: 100%; font-family: inherit;
  }
  textarea.form-input { resize: none; }
  .info-block { background: var(--secondary); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .info-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
  .info-icon { width: 32px; display: flex; align-items: center; justify-content: center; }
  .info-icon svg { width: 20px; height: 20px; }
  .info-content { flex: 1; }
  .info-label { font-size: 11px; color: var(--hint); font-weight: 600; text-transform: uppercase; }
  .info-value { font-size: 14px; font-weight: 500; margin-top: 2px; }
  .map-container {
    width: 100%; height: 200px; border-radius: 16px; overflow: hidden;
    background: var(--secondary); margin-bottom: 12px;
  }
  .map-container iframe { width: 100%; height: 100%; border: none; }
  .news-card { background: var(--secondary); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
  .news-badge {
    display: inline-block; font-size: 10px; padding: 3px 8px;
    border-radius: 8px; font-weight: 700; margin-bottom: 8px; text-transform: uppercase;
  }
  .news-badge.promo { background: var(--warning); color: white; }
  .news-badge.news { background: var(--btn); color: white; }
  .news-title { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .news-desc { font-size: 13px; color: var(--hint); line-height: 1.4; }
  .news-date { font-size: 11px; color: var(--hint); margin-top: 8px; }
  .theme-toggle {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; background: var(--secondary);
    border-radius: 12px; margin-bottom: 12px; cursor: pointer;
  }
  .theme-toggle-label { flex: 1; font-size: 14px; font-weight: 500; }
  .switch {
    width: 44px; height: 26px; background: var(--hint);
    border-radius: 13px; position: relative;
  }
  .switch.on { background: var(--success); }
  .switch::after {
    content: ''; position: absolute; width: 22px; height: 22px;
    background: white; border-radius: 50%; top: 2px; left: 2px;
  }
  .switch.on::after { left: 20px; }
  .notification-banner {
    position: fixed; top: calc(10px + env(safe-area-inset-top));
    left: 50%; transform: translateX(-50%);
    width: calc(100% - 32px); max-width: 448px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 16px; padding: 12px 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    z-index: 1000; display: flex; align-items: center; gap: 12px;
    animation: slideDown 0.3s ease;
  }
  @keyframes slideDown { from { transform: translate(-50%, -100%); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
  .notif-icon {
    width: 40px; height: 40px; border-radius: 50%; background: var(--btn); color: var(--btn-text);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .notif-content { flex: 1; min-width: 0; }
  .notif-title { font-weight: 700; font-size: 13px; }
  .notif-text { font-size: 12px; color: var(--hint); margin-top: 2px; }
  .notif-close { background: none; border: none; color: var(--hint); font-size: 18px; cursor: pointer; padding: 4px; }
  .history-item {
    padding: 12px; background: var(--secondary); border-radius: 12px;
    margin-bottom: 8px; display: flex; gap: 12px; align-items: center;
  }
  .history-icon {
    width: 40px; height: 40px; border-radius: 10px; background: var(--bg);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .history-info { flex: 1; min-width: 0; }
  .history-title { font-weight: 600; font-size: 13px; }
  .history-sub { font-size: 11px; color: var(--hint); margin-top: 2px; }
  .social-row { display: flex; gap: 10px; margin-top: 12px; }
  .social-btn {
    flex: 1; padding: 12px; background: var(--secondary);
    border: none; border-radius: 12px;
    cursor: pointer; color: var(--text);
    display: flex; align-items: center; justify-content: center;
  }
  .social-btn svg { width: 24px; height: 24px; }
  .chip {
    display: inline-block; padding: 4px 10px; border-radius: 10px;
    background: var(--secondary); font-size: 11px; font-weight: 600;
    color: var(--hint); margin-right: 4px; margin-bottom: 4px; cursor: pointer;
  }
  .chip.active { background: var(--btn); color: var(--btn-text); }
  .filter-row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
  .schedule-grid {
    display: grid; grid-template-columns: 60px repeat(7, 1fr);
    gap: 2px; background: var(--border); border-radius: 12px;
    overflow: hidden; margin-bottom: 12px; font-size: 11px;
  }
  .schedule-cell {
    background: var(--bg); padding: 8px 4px; text-align: center;
    min-height: 36px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; position: relative;
  }
  .schedule-cell.header { background: var(--secondary); font-weight: 700; font-size: 10px; cursor: default; }
  .schedule-cell.time { background: var(--secondary); font-weight: 600; font-size: 10px; cursor: default; }
  .schedule-cell.available { background: rgba(52,199,89,0.15); color: var(--success); }
  .schedule-cell.booked { background: rgba(51,144,236,0.2); color: var(--btn); font-weight: 600; }
  .schedule-cell.blocked-cell { background: repeating-linear-gradient(45deg, var(--bg), var(--bg) 4px, var(--secondary) 4px, var(--secondary) 8px); color: var(--hint); }
  .block-list { display: flex; flex-direction: column; gap: 8px; }
  .block-item {
    background: var(--secondary); border-radius: 12px; padding: 12px;
    display: flex; align-items: center; gap: 12px;
  }
  .block-info { flex: 1; }
  .block-date { font-weight: 700; font-size: 14px; }
  .block-reason { font-size: 12px; color: var(--hint); margin-top: 2px; }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    z-index: 1000; display: flex; align-items: flex-end; justify-content: center;
    animation: fadeIn 0.2s;
  }
  .modal {
    background: var(--bg); width: 100%; max-width: 480px;
    border-radius: 20px 20px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
    max-height: 85vh; overflow-y: auto;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; text-align: center; }
  .modal-sub { font-size: 13px; color: var(--hint); text-align: center; margin-bottom: 16px; }
  .reason-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .reason-item {
    padding: 12px 14px; background: var(--secondary); border-radius: 12px;
    display: flex; align-items: center; gap: 12px; cursor: pointer;
    border: 2px solid transparent;
  }
  .reason-item.selected { border-color: var(--btn); background: rgba(51,144,236,0.1); }
  .reason-radio {
    width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--hint);

// Telegram Cloud Storage wrapper
const cloudStorage = {
  get: (key) => new Promise((resolve) => {
    if (!tg || !tg.CloudStorage) return resolve(null);
    try {
      tg.CloudStorage.getItem(key, (err, data) => {
        if (err || !data) resolve(null);
        else { try { resolve(JSON.parse(data)); } catch { resolve(data); } }
      });
    } catch { resolve(null); }
  }),
  set: (key, value) => new Promise((resolve) => {
    if (!tg || !tg.CloudStorage) return resolve(false);
    try {
      const str = typeof value === "string" ? value : JSON.stringify(value);
      tg.CloudStorage.setItem(key, str, (err) => resolve(!err));
    } catch { resolve(false); }
  }),
};

  useEffect(() => {
    let touchStartX = 0;

    let isSwiping = false;

    const handleTouchStart = (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      isSwiping = touchStartX < 30;
    };

    const handleTouchMove = (e) => {
      if (!isSwiping) return;
      const touchX = e.touches[0].clientX;
      const touchY = e.touches[0].clientY;
      const deltaX = touchX - touchStartX;
      const deltaY = Math.abs(touchY - touchStartY);
      
      if (deltaX > 50 && deltaY < 100 && screen !== "home") {
        e.preventDefault();
        goBack();
        isSwiping = false;
      }
    };

    const handleTouchEnd = () => { isSwiping = false; };

    document.addEventListener('touchstart', handleTouchStart, { passive: true });
    document.addEventListener('touchmove', handleTouchMove, { passive: false });
    document.addEventListener('touchend', handleTouchEnd);

    return () => {
      document.removeEventListener('touchstart', handleTouchStart);
      document.removeEventListener('touchmove', handleTouchMove);
      document.removeEventListener('touchend', handleTouchEnd);
    };
  }, [screen]);

  // Pull to refresh
  useEffect(() => {
    const handleTouchStart = (e) => {
      if (window.scrollY === 0) {
        touchStartRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY, time: Date.now() };
      }
    };
    const handleTouchMove = (e) => {
      const startY = touchStartRef.current.y;
      if (!startY) return;
      const deltaY = e.touches[0].clientY - startY;
      if (deltaY > 0 && window.scrollY === 0) {
        setPullState({ pulling: true, refreshing: false, distance: Math.min(deltaY, 100) });
      }
    };
    const handleTouchEnd = () => {
      if (pullState.pulling && pullState.distance > 60) {
        setPullState({ pulling: false, refreshing: true, distance: 0 });
        doRefresh();
      } else {
        setPullState({ pulling: false, refreshing: false, distance: 0 });
      }
      touchStartRef.current = { x: 0, y: 0, time: 0 };
    };

    document.addEventListener('touchstart', handleTouchStart, { passive: true });
    document.addEventListener('touchmove', handleTouchMove, { passive: true });
    document.addEventListener('touchend', handleTouchEnd);

          const updated = appointments.map(x => x.id === a.id ? { ...x, reminderShown: true } : x);
          setAppointments(updated);
          save(LS.appts, updated);
          break;
        }
      }
    };
    checkReminders();
    const interval = setInterval(checkReminders, 60000);
    return () => clearInterval(interval);
  }, [appointments, lang]);

  // MainButton with progress
  useEffect(() => {
    if (!tg || !tg.MainButton) return;
    const hide = () => { try { tg.MainButton.hide(); } catch {} };
    const show = (text, onClick) => {
      try {
        tg.MainButton.setText(text);
        tg.MainButton.show();
        tg.MainButton.onClick(onClick);
      } catch {}
    };

    if (["home","success","info","news","appointments","admin","profile","settings"].includes(screen) && !editProfile) {
      hide();
      return () => hide();
    }

    const stepText = currentStep >= 0 ? ` (${currentStep + 1}/${steps.length})` : "";

    if (screen === "services") show(t.next + stepText, () => { if (!booking.service) tg.showAlert(t.selectServiceMsg); else setScreen("doctors"); });
    else if (screen === "doctors") show(t.next + stepText, () => { if (!booking.doctor) tg.showAlert(t.selectDoctorMsg); else setScreen("date"); });
    else if (screen === "date") show(t.next + stepText, () => { if (!booking.date) tg.showAlert(t.selectDateMsg); else setScreen("time"); });
    else if (screen === "time") show(t.next + stepText, () => { if (!booking.time) tg.showAlert(t.selectTimeMsg); else setScreen("confirm"); });
    else if (screen === "confirm") show(t.confirm, () => {
      const patientName = booking.patientId 
        ? (() => { const m = familyMembers.find(x => x.id === booking.patientId); return m ? m.name : "Guest"; })()
        : (user ? (user.firstName + " " + user.lastName).trim() : "Guest");
      const newAppt = {
        id: Date.now(), userId: user ? user.id : 0,
        userName: patientName || "Guest",
        patientId: booking.patientId || null,
        service: booking.service, doctorId: booking.doctor,
        date: booking.date, time: booking.time,
        status: "confirmed", reminder: true, reminderShown: false,
        createdAt: new Date().toISOString(),
      };
      const updated = appointments.concat([newAppt]);
      setAppointments(updated);
      save(LS.appts, updated);
      setBooking({ service:null, doctor:null, date:null, time:null, patientId:null });
      setScreen("success");
    });
    else if (screen === "profile" && editProfile) show(t.save, () => {
      save(LS.profile, profile);
      setEditProfile(false);
    });

    return () => hide();
  }, [screen, booking, appointments, user, lang, profile, editProfile, t, currentStep]);

  // Smart tips
  useEffect(() => {
    const tips = load(LS.tips, {});
    if (screen === "doctors" && booking.service && !tips.nearest) {
      setSmartTip({ id: "nearest", text: t.tipNearest });
    } else if (screen === "appointments" && !tips.reschedule) {
      const hasUpcoming = appointments.some(a => a.status === "confirmed" && a.date >= todayStr && (!isAdmin || a.userId === user?.id));
      if (hasUpcoming) {
        setSmartTip({ id: "reschedule", text: t.tipReschedule });
      }
    } else if (screen === "profile" && familyMembers.length === 0 && !tips.family) {
      setSmartTip({ id: "family", text: t.tipFamily });
    } else {
      setSmartTip(null);
    }
  }, [screen, booking.service, appointments, familyMembers.length, lang]);

  const dismissTip = (id) => {
    const tips = load(LS.tips, {});
    tips[id] = true;
    save(LS.tips, tips);
    setSmartTip(null);
  };

  const svcName = (id) => {
    const s = services.find(x => x.id === id);
    if (!s) return id;
    return lang === "ru" ? s.nameRu : s.nameEn;
  };
  const formatDate = (d) => {
    if (!d) return "";
    try { return new Date(d).toLocaleDateString(lang === "ru" ? "ru-RU" : "en-US", { day:"numeric", month:"long", year:"numeric" }); }
    catch { return d; }
  };
  const doctorName = (id) => {
    const d = doctors.find(x => x.id === id);
    return d ? (lang === "ru" ? d.nameRu : d.nameEn) : "";
  };

  const goBack = () => {
    const back = { doctors:"services", date:"doctors", time:"date", confirm:"time" };
    setScreen(back[screen] || "home");
  };

  const bookAgain = (appt) => {
    setBooking({ service: appt.service, doctor: appt.doctorId, date: null, time: null, patientId: appt.patientId || null });
    setScreen("date");
  };

  const rescheduleAppt = (appt) => {
    setBooking({ 
      service: appt.service, 
      doctor: appt.doctorId, 
      date: null, 
      time: null, 
      patientId: appt.patientId || null,
      rescheduleFrom: appt.id
    });
    setScreen("date");
  };

  const openCancelModal = (id) => {
    setCancelModal({ id, reason: null, customReason: "" });
  };
  const submitCancel = () => {
    if (!cancelModal) return;
    let reasonText = cancelModal.reason;
    if (cancelModal.reason === "other" && cancelModal.customReason) reasonText = cancelModal.customReason;
    const updated = appointments.map(a => a.id === cancelModal.id ? {
      ...a, status: "cancelled", cancelReason: reasonText || "—"
    } : a);
    setAppointments(updated);
    save(LS.appts, updated);
    setCancelModal(null);
  };

  // Handle reschedule completion
  useEffect(() => {
    if (screen === "success" && booking.rescheduleFrom) {
      const oldId = booking.rescheduleFrom;
      const updated = appointments.map(a => a.id === oldId ? {
        ...a, status: "cancelled", cancelReason: lang === "ru" ? "Перенос" : "Rescheduled", rescheduledTo: appointments[appointments.length-1]?.id
      } : a);
      setAppointments(updated);
      save(LS.appts, updated);
      setBooking({ ...booking, rescheduleFrom: null });
    }
  }, [screen]);

  const nearestSlots = useMemo(() => {
    if (!booking.service) return [];
    const result = [];
    const start = new Date(today);
    start.setDate(start.getDate() + 1);
    for (let dayOff = 0; dayOff < 30 && result.length < 10; dayOff++) {
      const d = new Date(start);
      d.setDate(d.getDate() + dayOff);
      const ds = d.toISOString().split("T")[0];
      if (blocks.some(b => b.date === ds)) continue;
      for (let di = 0; di < doctors.length && result.length < 10; di++) {
        const doc = doctors[di];
        if (doc.services.indexOf(booking.service) === -1) continue;
        for (let ti = 0; ti < timeSlots.length && result.length < 10; ti++) {
          const time = timeSlots[ti];
          const taken = appointments.some(a => a.date === ds && a.time === time && a.doctorId === doc.id && a.status === "confirmed");
          if (!taken) {
            result.push({ date: ds, time, doctorId: doc.id });
            break;
          }
        }
      }
    }
    return result;
  }, [booking.service, doctors, appointments, blocks, today, timeSlots]);

  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const firstDay = (new Date(calYear, calMonth, 1).getDay() + 6) % 7;
  const monthName = new Date(calYear, calMonth).toLocaleDateString(lang === "ru" ? "ru-RU" : "en-US", { month:"long", year:"numeric" });
  const weekdays = lang === "ru" ? ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"] : ["Mo","Tu","We","Th","Fr","Sa","Su"];

  const isDatePast = (day) => { const d = new Date(calYear, calMonth, day); d.setHours(0,0,0,0); return d < today; };
  const isDateToday = (day) => { const d = new Date(calYear, calMonth, day); d.setHours(0,0,0,0); return d.getTime() === today.getTime(); };
  const isDateBlocked = (day) => {
    const ds = new Date(calYear, calMonth, day).toISOString().split("T")[0];
    return blocks.some(b => b.date === ds);
  };

  const bookedTimes = useMemo(() => {
    if (!booking.date || !booking.doctor) return [];
    return appointments.filter(a => a.date === booking.date && a.doctorId === booking.doctor && a.status === "confirmed").map(a => a.time);
  }, [appointments, booking.date, booking.doctor]);

  const filteredDoctors = useMemo(() => {
    if (!serviceFilter) return doctors;
    return doctors.filter(d => d.services.indexOf(serviceFilter) !== -1);
  }, [serviceFilter, doctors]);

  const myAppts = useMemo(() => {
    if (isAdmin) return appointments;
    return appointments.filter(a => a.userId === (user ? user.id : -1));
  }, [appointments, user, isAdmin]);

  const filteredMyAppts = useMemo(() => {
    let list = myAppts.slice();
    if (apptTab === "upcoming") list = list.filter(a => a.date >= todayStr && a.status === "confirmed");
    else if (apptTab === "past") list = list.filter(a => a.date < todayStr || a.status === "cancelled");
    return list.sort((a,b) => b.date.localeCompare(a.date));
  }, [myAppts, apptTab, todayStr]);

  const adminStats = useMemo(() => ({
    total: appointments.length,
    today: appointments.filter(a => a.date === todayStr && a.status === "confirmed").length,
    upcoming: appointments.filter(a => a.date >= todayStr && a.status === "confirmed").length,
    cancelled: appointments.filter(a => a.status === "cancelled").length,
  }), [appointments, todayStr]);

  const cancelStats = useMemo(() => {
    const cancelled = appointments.filter(a => a.status === "cancelled" && a.cancelReason);
    const counts = {};
    cancelled.forEach(a => { counts[a.cancelReason] = (counts[a.cancelReason] || 0) + 1; });
    return Object.entries(counts).sort((a,b) => b[1] - a[1]);
  }, [appointments]);

  const filteredAdminAppts = useMemo(() => {
    let list = appointments.slice();
    if (adminFilter === "today") list = list.filter(a => a.date === todayStr);
    else if (adminFilter === "upcoming") list = list.filter(a => a.date >= todayStr && a.status === "confirmed");
    else if (adminFilter === "cancelled") list = list.filter(a => a.status === "cancelled");
    if (adminSearch) {
      const q = adminSearch.toLowerCase();
      list = list.filter(a => a.userName.toLowerCase().indexOf(q) !== -1);
    }
    return list.sort((a,b) => b.createdAt.localeCompare(a.createdAt));
  }, [appointments, adminFilter, adminSearch, todayStr]);

  const scheduleWeekStart = useMemo(() => {
    const d = new Date();
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + scheduleWeek * 7);
    d.setHours(0,0,0,0);
    return d;
  }, [scheduleWeek]);

  const scheduleWeekDays = useMemo(() => {
    const arr = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(scheduleWeekStart);
      d.setDate(d.getDate() + i);
      arr.push(d);
    }
    return arr;
  }, [scheduleWeekStart]);

  const renderHeader = (title, showBack, rightSlot) => (
    <div className="header">
      <div className="header-left">
        {showBack && <button className="back-btn" onClick={goBack}>{Icons.back}</button>}
      </div>
      <div className="header-title">{title}</div>
      <div className="header-right">
        {rightSlot}
        <div className="lang-switch">
          <button className={"lang-btn " + (lang==="ru"?"active":"")} onClick={() => { setLang("ru"); localStorage.setItem(LS.lang,"ru"); }}>RU</button>
          <button className={"lang-btn " + (lang==="en"?"active":"")} onClick={() => { setLang("en"); localStorage.setItem(LS.lang,"en"); }}>EN</button>
        </div>
      </div>
    </div>
  );

  const renderStepIndicator = () => (
    <div className="step-indicator">
      {steps.map((s,i) => <div key={s} className={"step-dot " + (i===currentStep?"active":"") + (i<currentStep?" done":"")} />)}
    </div>
  );

  // Onboarding
  if (showOnboarding) {
    const slides = [
      { icon: "", title: t.onboarding1Title, desc: t.onboarding1Desc },
      { icon: "🔔", title: t.onboarding2Title, desc: t.onboarding2Desc },
      { icon: "👨‍👩‍👧", title: t.onboarding3Title, desc: t.onboarding3Desc },
      { icon: "✨", title: t.onboarding4Title, desc: t.onboarding4Desc },
    ];
    const slide = slides[onboardingStep];
    return (
      <div className="onboarding">
        <div className="onboarding-illustration">{slide.icon}</div>
        <div className="onboarding-title">{slide.title}</div>
        <div className="onboarding-desc">{slide.desc}</div>
        <div className="onboarding-dots">
          {slides.map((_, i) => <div key={i} className={"onboarding-dot " + (i===onboardingStep?"active":"")} />)}
        </div>
        <div style={{display:"flex", gap:10}}>
          {onboardingStep < slides.length - 1 && (
            <button className="onboarding-btn" style={{background:"var(--secondary)", color:"var(--text)"}} onClick={() => {
              localStorage.setItem(LS.onboarding, "true");
              setShowOnboarding(false);
            }}>{t.skip}</button>
          )}
          <button className="onboarding-btn" onClick={() => {
            if (onboardingStep < slides.length - 1) setOnboardingStep(onboardingStep + 1);
            else { localStorage.setItem(LS.onboarding, "true"); setShowOnboarding(false); }
          }}>{onboardingStep < slides.length - 1 ? t.next : t.startUsing}</button>
        </div>
      </div>
    );
  }

  const allPatients = [
    { id: null, name: t.forMyself, initials: user?.firstName?.[0] || "?" },
    ...familyMembers.map(m => ({ id: m.id, name: m.name, initials: m.name[0] || "?" }))
  ];

  // HOME
  if (screen === "home") return (
    <div className="app">
      {notification && (
        <div className="notification-banner">
          <div className="notif-icon">{Icons[notification.icon] || Icons.bell}</div>
          <div className="notif-content">
            <div className="notif-title">{notification.title}</div>
            <div className="notif-text">{notification.text}</div>
          </div>
          <button className="notif-close" onClick={() => setNotification(null)}>×</button>
        </div>
      )}
      {cloudStatus === "saved" && (
        <div style={{position:"fixed", top:"60px", right:"16px", background:"var(--success)", color:"white", padding:"6px 12px", borderRadius:"20px", fontSize:"11px", fontWeight:600, zIndex:999}}>
          ✓ {t.cloudSaved}
        </div>
      )}
      <div className="ptr-indicator" style={{opacity: pullState.pulling ? 1 : 0, transform: `translateY(${pullState.distance}px)`}}>
        {pullState.refreshing ? "⟳ " + t.refreshing : "↓ " + t.pullToRefresh}
      </div>
      <div className="fade-in">
        <div className="hero">
          <div className="hero-pattern"></div>
          <div className="hero-content">
            <div className="hero-top">
              <div className="hero-logo"></div>
              <div className="hero-badge">{t.synced} ✓</div>
            </div>
            <div className="hero-bottom">
              <h1>{t.clinicName}</h1>
              <p>{t.clinicSub}</p>
            </div>
          </div>
        </div>
        {user && (
          <div className="user-card">
            <div className="avatar">
              {user.photoUrl ? <img src={user.photoUrl} alt="" /> : (user.firstName ? user.firstName[0] : "").toUpperCase()}
            </div>
            <div className="user-info">
              <div className="user-name">{t.greeting}, {user.firstName || "Friend"}!</div>
              <div className="user-sub">{user.username ? "@" + user.username : t.welcome}</div>
            </div>
            <button className="icon-btn" onClick={() => setScreen("settings")}>{Icons.settings}</button>
          </div>
        )}
        <div className="menu-grid">
          <button className="menu-btn primary" onClick={() => { setBooking({ service:null, doctor:null, date:null, time:null, patientId:null }); setScreen("services"); }}>
            {Icons.calendar}<span>{t.bookAppt}</span>
          </button>
          <button className="menu-btn" onClick={() => setScreen("appointments")}>
            {Icons.clipboard}<span>{t.myAppts}</span>
          </button>
          <button className="menu-btn" onClick={() => { setEditProfile(false); setScreen("profile"); }}>
            {Icons.user}<span>{t.profile}</span>
          </button>
          <button className="menu-btn" onClick={() => setScreen("info")}>
            {Icons.mapPin}<span>{t.info}</span>
          </button>
          <button className="menu-btn" onClick={() => setScreen("news")}>
            {Icons.gift}<span>{t.news}</span>
          </button>
          <button className="menu-btn primary" onClick={() => { if (tg && tg.openTelegramLink) tg.openTelegramLink("https://t.me/" + BOT_USERNAME); else window.open("https://t.me/" + BOT_USERNAME, "_blank"); }}>
            {Icons.messageCircle}<span>{t.contactClinic}</span>
          </button>
          {isAdmin && (
            <button className="menu-btn full" onClick={() => setScreen("admin")}>
              {Icons.settings}<span>{t.admin}</span>
            </button>
          )}
        </div>
      </div>
    </div>
  );

  // SERVICES
  if (screen === "services") return (
    <div className="app">
      {renderHeader(t.selectService, true)}
      {renderStepIndicator()}
      <div className="services-list fade-in">
        {services.map(s => (
          <div key={s.id} className={"service-card " + (booking.service===s.id?"selected":"")}
            onClick={() => setBooking({ ...booking, service: s.id, doctor: null, time: null })}>
            <div className="service-icon">{Icons[s.icon] || Icons.stethoscope}</div>
            <div className="service-info">
              <div className="service-name">{lang === "ru" ? s.nameRu : s.nameEn}</div>
              <div className="service-meta">{s.duration} {t.min} · {s.price} {t.rub}</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );

  // DOCTORS
  if (screen === "doctors") return (
    <div className="app">
      {renderHeader(t.selectDoctor, true)}
      {renderStepIndicator()}
      <div className="fade-in">
        <div style={{fontSize:12, color:"var(--hint)", marginBottom:8, fontWeight:600}}>{t.filterByService}</div>
        <div className="filter-row">
          <span className={"chip " + (!serviceFilter?"active":"")} onClick={() => setServiceFilter(null)}>{t.allDoctors}</span>
          {services.map(s => (
            <span key={s.id} className={"chip " + (serviceFilter===s.id?"active":"")} onClick={() => setServiceFilter(s.id)}>{lang === "ru" ? s.nameRu : s.nameEn}</span>
          ))}
        </div>
        {booking.service && (
          <button className="btn-small primary" style={{width:"100%", padding:12, marginBottom:12, fontSize:13}} onClick={() => setShowNearest(true)}>
            {Icons.search} {t.findNearest}
          </button>
        )}
        {filteredDoctors.length === 0 ? (
          <div className="empty-state"><div className="empty-icon">{Icons.empty}</div><div>{t.noDoctors}</div></div>
        ) : (
          <div className="doctors-list">
            {filteredDoctors.map(d => (
              <div key={d.id} className={"doctor-card " + (booking.doctor===d.id?"selected":"")}
                onClick={() => setBooking({ ...booking, doctor: d.id, time: null })}>
                <div className="doctor-avatar" style={{background: d.gradient}}>{d.initials}</div>
                <div className="doctor-info">
                  <div className="doctor-name">{lang === "ru" ? d.nameRu : d.nameEn}</div>
                  <div className="doctor-spec">{lang === "ru" ? d.specRu : d.specEn}</div>
                  <div className="doctor-rating">{Icons.star} {d.rating} · {d.reviews} {t.reviews}</div>
                  <div className="doctor-tags">
                    {d.services.slice(0,3).map(sid => <span key={sid} className="doctor-tag">{svcName(sid)}</span>)}
                  </div>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
      {renderNearestModal()}
      {smartTip && smartTip.id === "nearest" && (
        <div className="smart-tip">
          <div className="smart-tip-icon">💡</div>
          <div className="smart-tip-text">{smartTip.text}</div>
          <button className="smart-tip-close" onClick={() => dismissTip("nearest")}>×</button>
        </div>
      )}
    </div>
  );

  // DATE
  if (screen === "date") return (
    <div className="app">
      {renderHeader(t.selectDate, true)}
      {renderStepIndicator()}
      <div className="calendar fade-in">
        <div className="cal-header">
          <button className="cal-nav" onClick={() => { if (calMonth===0){setCalMonth(11);setCalYear(calYear-1);}else setCalMonth(calMonth-1); }}>‹</button>
          <div className="cal-title">{monthName}</div>
          <button className="cal-nav" onClick={() => { if (calMonth===11){setCalMonth(0);setCalYear(calYear+1);}else setCalMonth(calMonth+1); }}>›</button>
        </div>
        <div className="cal-weekdays">{weekdays.map(w => <div key={w} className="cal-weekday">{w}</div>)}</div>
        <div className="cal-days">
          {Array.from({length: firstDay}).map((_,i) => <div key={"e"+i} />)}
          {Array.from({length: daysInMonth}).map((_,i) => {
            const day = i + 1;
            const past = isDatePast(day);
            const todayDay = isDateToday(day);
            const blocked = isDateBlocked(day);
            const ds = new Date(calYear, calMonth, day).toISOString().split("T")[0];
            const selected = booking.date === ds;
            return (
              <button key={day}
                className={"cal-day " + (selected?"selected ":"") + (todayDay?"today ":"") + (blocked?"blocked":"")}
                disabled={past || blocked}
                onClick={() => setBooking({ ...booking, date: ds, time: null })}>
                {day}
              </button>
            );
          })}
        </div>
        {blocks.length > 0 && <div style={{fontSize:11, color:"var(--hint)", marginTop:8, textAlign:"center"}}>{t.blockedHint}</div>}
      </div>
    </div>
  );

  // TIME
  if (screen === "time") return (
    <div className="app">
      {renderHeader(t.selectTime, true)}
      {renderStepIndicator()}
      <div className="fade-in">
        <div style={{marginBottom:12, fontSize:13, color:"var(--hint)"}}>
          {doctorName(booking.doctor)} · {formatDate(booking.date)}
        </div>
        <div className="time-grid">
          {timeSlots.map(time => {
            const booked = bookedTimes.indexOf(time) !== -1;
            const selected = booking.time === time;
            return (
              <button key={time} className={"time-slot " + (selected?"selected":"")} disabled={booked}
                onClick={() => setBooking({...booking, time})}>
                {time}
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );

  // CONFIRM
  if (screen === "confirm") {
    const service = services.find(s => s.id === booking.service);
    const patientName = booking.patientId 
      ? (() => { const m = familyMembers.find(x => x.id === booking.patientId); return m ? m.name : "Guest"; })()
      : (user ? user.firstName + " " + user.lastName : "Guest");
    return (
      <div className="app">
        {renderHeader(t.confirm, true)}
        {renderStepIndicator()}
        <div className="confirm-card fade-in">
          <div className="confirm-row"><div className="confirm-label">{t.patient}</div><div className="confirm-value">{patientName}</div></div>
          <div className="confirm-row"><div className="confirm-label">{t.service}</div><div className="confirm-value">{svcName(booking.service)}</div></div>
          <div className="confirm-row"><div className="confirm-label">{t.doctor}</div><div className="confirm-value">{doctorName(booking.doctor)}</div></div>
          <div className="confirm-row"><div className="confirm-label">{t.date}</div><div className="confirm-value">{formatDate(booking.date)}</div></div>
          <div className="confirm-row"><div className="confirm-label">{t.time}</div><div className="confirm-value">{booking.time}</div></div>
          <div className="confirm-row"><div className="confirm-label">{t.price}</div><div className="confirm-value">{service ? service.price : 0} {t.rub}</div></div>
        </div>
        <div style={{fontSize:12, color:"var(--hint)", textAlign:"center"}}>
          🔔 {lang==="ru"?"Напоминание за 24ч и за 1ч":"Reminder 24h and 1h before"}
        </div>
      </div>
    );

                    }}>
                      {status === "booked" ? "●" : status === "blocked-cell" ? "×" : ""}
                    </div>
                  );
                });
                return cells;
              })}
            </div>
            <div style={{display:"flex", gap:12, fontSize:11, color:"var(--hint)", marginTop:8, justifyContent:"center"}}>
              <span><span style={{color:"var(--success)"}}>●</span> {t.available}</span>
              <span><span style={{color:"var(--btn)"}}>●</span> {t.booked}</span>
              <span><span style={{color:"var(--hint)"}}>×</span> {t.blocked}</span>
            </div>
          </>
        )}
        {adminTab === "blocks" && (
          <>
            <div className="info-block">
              <div className="form-group">
                <label className="form-label">{t.date}</label>
                <input className="form-input" type="date" value={newBlockDate} onChange={e => setNewBlockDate(e.target.value)} />
              </div>
              <div className="form-group" style={{marginTop:10}}>
                <label className="form-label">{t.blockReason}</label>
                <input className="form-input" placeholder={t.blockReason} value={newBlockReason} onChange={e => setNewBlockReason(e.target.value)} />
              </div>
              <button className="btn-small primary" style={{marginTop:12, width:"100%", padding:12}} onClick={() => {
                if (!newBlockDate) return;
                const newBlocks = blocks.concat([{ id: Date.now(), date: newBlockDate, reason: newBlockReason || (lang === "ru" ? "Заблокировано" : "Blocked") }]);
                setBlocks(newBlocks); save(LS.blocks, newBlocks);
                setNewBlockDate(""); setNewBlockReason("");
              }}>
                {Icons.plus} {t.addBlock}
              </button>
            </div>
            <div className="section-title">{t.blockedDates} ({blocks.length})</div>
            {blocks.length === 0 ? (
              <div className="empty-state" style={{padding:20}}><div>{t.noBlocks}</div></div>
            ) : blocks.slice().sort((a,b) => a.date.localeCompare(b.date)).map(b => (
              <div key={b.id} className="block-item">
                <div style={{fontSize:24}}>{Icons.ban}</div>
                <div className="block-info">
                  <div className="block-date">{formatDate(b.date)}{b.time ? " · " + b.time : ""}</div>
                  <div className="block-reason">{b.reason}</div>
                </div>
                <button className="btn-small danger" onClick={() => {
                  const newBlocks = blocks.filter(x => x.id !== b.id);
                  setBlocks(newBlocks); save(LS.blocks, newBlocks);
                }}>{Icons.x}</button>
              </div>
            ))}
          </>
        )}
        {adminTab === "doctors" && (
          <>
            <button className="btn-small primary" style={{width:"100%", padding:12, marginBottom:12, fontSize:13}}
              onClick={() => setEntityEditor({
                type: "doctor", isNew: true,
                data: { id:"", nameRu:"", nameEn:"", specRu:"", specEn:"", rating:5.0, reviews:0, gradient:"linear-gradient(135deg,#667eea,#764ba2)", services:[], initials:"" }
              })}>
              {Icons.plus} {t.addDoctor}
            </button>
            {doctors.map(d => (
              <div key={d.id} className="entity-card">
                <div className="gradient-preview" style={{background: d.gradient}}>{d.initials}</div>
                <div className="entity-info">
                  <div className="entity-name">{lang === "ru" ? d.nameRu : d.nameEn}</div>
                  <div className="entity-meta">{lang === "ru" ? d.specRu : d.specEn} · ⭐{d.rating}</div>
                </div>
                <div className="entity-actions">
                  <button className="btn-small" onClick={() => setEntityEditor({ type:"doctor", isNew:false, data: {...d} })}>{Icons.edit}</button>
                  <button className="btn-small danger" onClick={() => {
                    if (confirm(t.deleteConfirm + "?")) {
                      const newDoctors = doctors.filter(x => x.id !== d.id);
                      setDoctors(newDoctors); save(LS.doctors, newDoctors);
                    }
                  }}>{Icons.trash}</button>
                </div>
              </div>
            ))}
          </>
        )}
        {adminTab === "services" && (
          <>
            <button className="btn-small primary" style={{width:"100%", padding:12, marginBottom:12, fontSize:13}}
              onClick={() => setEntityEditor({
                type: "service", isNew: true,
                data: { id:"", nameRu:"", nameEn:"", icon:"stethoscope", duration:30, price:0 }
              })}>
              {Icons.plus} {t.addService}
            </button>
            {services.map(s => (
              <div key={s.id} className="entity-card">
                <div className="service-icon-preview">{Icons[s.icon] || Icons.stethoscope}</div>
                <div className="entity-info">
                  <div className="entity-name">{lang === "ru" ? s.nameRu : s.nameEn}</div>
                  <div className="entity-meta">{s.duration} {t.min} · {s.price} {t.rub}</div>
                </div>
                <div className="entity-actions">
                  <button className="btn-small" onClick={() => setEntityEditor({ type:"service", isNew:false, data: {...s} })}>{Icons.edit}</button>
                  <button className="btn-small danger" onClick={() => {
                    if (confirm(t.deleteConfirm + "?")) {
                      const newServices = services.filter(x => x.id !== s.id);
                      setServices(newServices); save(LS.services, newServices);
                    }
                  }}>{Icons.trash}</button>
                </div>
              </div>
            ))}
          </>
        )}
        {adminTab === "times" && (
          <>
            <div className="info-block">
              <div style={{fontSize:13, color:"var(--hint)", marginBottom:12, textAlign:"center"}}>{t.tapToToggle}</div>
              <div className="time-editor-grid">
                {DEFAULT_TIMES.map(time => {
                  const isActive = timeSlots.indexOf(time) !== -1;
                  return (
                    <div key={time} className={"time-editor-slot " + (isActive?"active":"")}
                      onClick={() => {
                        let newTimes;
                        if (isActive) {
                          newTimes = timeSlots.filter(x => x !== time);
                        } else {
                          newTimes = [...timeSlots, time].sort();
                        }
                        setTimeSlots(newTimes);
                        save(LS.times, newTimes);
                      }}>
                      {time}
                    </div>
                  );
                })}
              </div>
              <div style={{marginTop:12, paddingTop:12, borderTop:"1px solid var(--border)"}}>
                <div style={{fontSize:12, color:"var(--hint)", marginBottom:8}}>{t.addTime} ({lang === "ru" ? "произвольное" : "custom"})</div>
                <div style={{display:"flex", gap:8}}>
                  <input className="form-input" type="time" id="customTimeInput" style={{flex:1}} />
                  <button className="btn-small primary" onClick={() => {
                    const input = document.getElementById("customTimeInput");
                    const val = input.value;
                    if (val && timeSlots.indexOf(val) === -1) {
                      const newTimes = [...timeSlots, val].sort();
                      setTimeSlots(newTimes);
                      save(LS.times, newTimes);
                      input.value = "";
                    }
                  }}>{Icons.plus}</button>
                </div>
              </div>
            </div>
            <div className="section-title">{t.currentTimes} ({timeSlots.length})</div>
            <div style={{display:"flex", flexWrap:"wrap", gap:6}}>
              {timeSlots.sort().map(time => (
                <span key={time} className="chip active" onClick={() => {
                  const newTimes = timeSlots.filter(x => x !== time);
                  setTimeSlots(newTimes);
                  save(LS.times, newTimes);
                }}>{time} ×</span>
              ))}
            </div>
          </>
        )}
      </div>
      {renderCancelModal()}
      {renderEntityEditor()}
    </div>
  );

  return <div className="app"><div>Loading...</div></div>;
}

function renderCancelModal() {
  // Will be rendered inline
  return null;
}

  console.error(e);
}
</script>

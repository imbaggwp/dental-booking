const LS = { appts:"dental_appts_v3", profile:"dental_profile_v3", theme:"dental_theme_v3", lang:"dental_lang_v3", blocks:"dental_blocks_v3" };
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

function App() {
  const detectLang = () => {
    const saved = localStorage.getItem(LS.lang);
    if (saved === "ru" || saved === "en") return saved;
    const tgLang = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.language_code : null;
    if (tgLang && tgLang.startsWith("ru")) return "ru";
    return "ru";
  };

  const [lang, setLang] = useState(detectLang());
  const [themeMode, setThemeMode] = useState(() => localStorage.getItem(LS.theme) || "auto");
  const [screen, setScreen] = useState("home");
  const [user, setUser] = useState(null);
  const [appointments, setAppointments] = useState(() => load(LS.appts, []));
  const [profile, setProfile] = useState(() => load(LS.profile, {}));
  const [blocks, setBlocks] = useState(() => load(LS.blocks, []));
  const [booking, setBooking] = useState({ service:null, doctor:null, date:null, time:null });
  const [calMonth, setCalMonth] = useState(new Date().getMonth());
  const [calYear, setCalYear] = useState(new Date().getFullYear());
  const [adminTab, setAdminTab] = useState("stats");
  const [adminFilter, setAdminFilter] = useState("all");
  const [adminSearch, setAdminSearch] = useState("");
  const [serviceFilter, setServiceFilter] = useState(null);
  const [apptTab, setApptTab] = useState("upcoming");
  const [notification, setNotification] = useState(null);
  const [editProfile, setEditProfile] = useState(false);
  const [scheduleDoctor, setScheduleDoctor] = useState("d1");
  const [scheduleWeek, setScheduleWeek] = useState(0);
  const [newBlockDate, setNewBlockDate] = useState("");
  const [newBlockReason, setNewBlockReason] = useState("");

  const t = T[lang];
  const isAdmin = user && user.id === ADMIN_USER_ID;
  const today = new Date(); today.setHours(0,0,0,0);
  const todayStr = today.toISOString().split("T")[0];

  useEffect(() => {
    if (themeMode === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", themeMode);
    localStorage.setItem(LS.theme, themeMode);
  }, [themeMode]);

  useEffect(() => {
    if (tg) {
      try {
        tg.ready();
        tg.expand();
        const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
        if (u) setUser({ id:u.id, firstName:u.first_name||"", lastName:u.last_name||"", photoUrl:u.photo_url||null, username:u.username||null });
        else setUser({ id:0, firstName:"Guest", lastName:"", photoUrl:null, username:null });
      } catch(e) {
        setUser({ id:0, firstName:"Guest", lastName:"", photoUrl:null, username:null });
      }
    } else {
      setUser({ id:0, firstName:"Guest", lastName:"", photoUrl:null, username:null });
    }
  }, []);

  useEffect(() => {
    const checkReminders = () => {
      const now = new Date();
      for (let i = 0; i < appointments.length; i++) {
        const a = appointments[i];
        if (a.status !== "confirmed" || !a.reminder || a.reminderShown) continue;
        const apptTime = new Date(a.date + "T" + a.time + ":00");
        const diff = apptTime - now;
        if (diff > 0 && diff < 24 * 60 * 60 * 1000) {
          const diffHours = Math.round(diff / (60 * 60 * 1000));
          setNotification({
            id: a.id, icon: "🔔",
            title: t.reminderTitle,
            text: diffHours <= 1 ? t.reminderIn1 + ": " + a.time : t.reminderIn24 + " " + a.time,
          });
          const updated = appointments.map(x => x.id === a.id ? { ...x, reminderShown: true } : x);
          setAppointments(updated);
          save(LS.appts, updated);
          break;
        }
      }
    };
    checkReminders();
    const interval = setInterval(checkReminders, 60000);
    return () => clearInterval(interval);
  }, [appointments, lang]);

  useEffect(() => {
    if (!tg || !tg.MainButton) return;
    const hide = () => { try { tg.MainButton.hide(); } catch {} };
    const show = (text, onClick) => {
      try {
        tg.MainButton.setText(text);
        tg.MainButton.show();
        tg.MainButton.onClick(onClick);
      } catch {}
    };

    if (["home","success","info","news","appointments","admin","profile","settings"].includes(screen) && !editProfile) {
      hide();
      return () => hide();
    }

    if (screen === "services") show(t.next, () => { if (!booking.service) tg.showAlert(t.selectServiceMsg); else setScreen("doctors"); });
    else if (screen === "doctors") show(t.next, () => { if (!booking.doctor) tg.showAlert(t.selectDoctorMsg); else setScreen("date"); });
    else if (screen === "date") show(t.next, () => { if (!booking.date) tg.showAlert(t.selectDateMsg); else setScreen("time"); });
    else if (screen === "time") show(t.next, () => { if (!booking.time) tg.showAlert(t.selectTimeMsg); else setScreen("confirm"); });
    else if (screen === "confirm") show(t.confirm, () => {
      const newAppt = {
        id: Date.now(), userId: user ? user.id : 0,
        userName: (user ? (user.firstName + " " + user.lastName).trim() : "Guest") || "Guest",
        service: booking.service, doctorId: booking.doctor,
        date: booking.date, time: booking.time,
        status: "confirmed", reminder: true, reminderShown: false,
        createdAt: new Date().toISOString(),
      };
      const updated = appointments.concat([newAppt]);
      setAppointments(updated);
      save(LS.appts, updated);
      setBooking({ service:null, doctor:null, date:null, time:null });
      setScreen("success");
    });
    else if (screen === "profile" && editProfile) show(t.save, () => {
      save(LS.profile, profile);
      setEditProfile(false);
    });

    return () => hide();
  }, [screen, booking, appointments, user, lang, profile, editProfile, t]);

  const svcName = (id) => {
    const key = "s" + id.charAt(0).toUpperCase() + id.slice(1);
    return t[key] || id;
  };

  const formatDate = (d) => {
    if (!d) return "";
    try {
      const date = new Date(d);
      return date.toLocaleDateString(lang === "ru" ? "ru-RU" : "en-US", { day:"numeric", month:"long", year:"numeric" });
    } catch { return d; }
  };

  const doctorName = (id) => {
    const d = DOCTORS.find(x => x.id === id);
    return d ? d.name[lang] : "";
  };

  const toggleReminder = (id) => {
    const updated = appointments.map(a => a.id === id ? { ...a, reminder: !a.reminder, reminderShown: false } : a);
    setAppointments(updated);
    save(LS.appts, updated);
  };

  const cancelAppt = (id) => {
    const updated = appointments.map(a => a.id === id ? { ...a, status: "cancelled" } : a);
    setAppointments(updated);
    save(LS.appts, updated);
  };

  const confirmCancel = (id) => {
    if (tg && tg.showConfirm) tg.showConfirm(t.cancelConfirm, (ok) => { if (ok) cancelAppt(id); });
    else cancelAppt(id);
  };

  const openChat = () => {
    if (tg && tg.openTelegramLink) tg.openTelegramLink("https://t.me/" + BOT_USERNAME);
    else window.open("https://t.me/" + BOT_USERNAME, "_blank");
  };

  const callClinic = () => { window.location.href = "tel:" + CLINIC_INFO.phone.replace(/\s/g,""); };

  const goBack = () => {
    const back = { doctors:"services", date:"doctors", time:"date", confirm:"time" };
    setScreen(back[screen] || "home");
  };

  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const firstDay = (new Date(calYear, calMonth, 1).getDay() + 6) % 7;
  const monthName = new Date(calYear, calMonth).toLocaleDateString(lang === "ru" ? "ru-RU" : "en-US", { month:"long", year:"numeric" });
  const weekdays = lang === "ru" ? ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"] : ["Mo","Tu","We","Th","Fr","Sa","Su"];

  const isDatePast = (day) => { const d = new Date(calYear, calMonth, day); d.setHours(0,0,0,0); return d < today; };
  const isDateToday = (day) => { const d = new Date(calYear, calMonth, day); d.setHours(0,0,0,0); return d.getTime() === today.getTime(); };
  const isDateBlocked = (day) => {
    const ds = new Date(calYear, calMonth, day).toISOString().split("T")[0];
    return blocks.some(b => b.date === ds);
  };

  const bookedTimes = useMemo(() => {
    if (!booking.date || !booking.doctor) return [];
    return appointments.filter(a => a.date === booking.date && a.doctorId === booking.doctor && a.status === "confirmed").map(a => a.time);
  }, [appointments, booking.date, booking.doctor]);

  const filteredDoctors = useMemo(() => {
    if (!serviceFilter) return DOCTORS;
    return DOCTORS.filter(d => d.services.indexOf(serviceFilter) !== -1);
  }, [serviceFilter]);

  const myAppts = useMemo(() => {
    if (isAdmin) return appointments;
    return appointments.filter(a => a.userId === (user ? user.id : -1));
  }, [appointments, user, isAdmin]);

  const filteredMyAppts = useMemo(() => {
    let list = myAppts.slice();
    if (apptTab === "upcoming") list = list.filter(a => a.date >= todayStr && a.status === "confirmed");
    else if (apptTab === "past") list = list.filter(a => a.date < todayStr || a.status === "cancelled");
    return list.sort((a,b) => b.date.localeCompare(a.date));
  }, [myAppts, apptTab, todayStr]);

  const adminStats = useMemo(() => ({
    total: appointments.length,
    today: appointments.filter(a => a.date === todayStr && a.status === "confirmed").length,
    upcoming: appointments.filter(a => a.date >= todayStr && a.status === "confirmed").length,
    cancelled: appointments.filter(a => a.status === "cancelled").length,
  }), [appointments, todayStr]);

  const filteredAdminAppts = useMemo(() => {
    let list = appointments.slice();
    if (adminFilter === "today") list = list.filter(a => a.date === todayStr);
    else if (adminFilter === "upcoming") list = list.filter(a => a.date >= todayStr && a.status === "confirmed");
    else if (adminFilter === "cancelled") list = list.filter(a => a.status === "cancelled");
    if (adminSearch) {
      const q = adminSearch.toLowerCase();
      list = list.filter(a => a.userName.toLowerCase().indexOf(q) !== -1);
    }
    return list.sort((a,b) => b.createdAt.localeCompare(a.createdAt));
  }, [appointments, adminFilter, adminSearch, todayStr]);

  const scheduleWeekStart = useMemo(() => {
    const d = new Date();
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + scheduleWeek * 7);
    d.setHours(0,0,0,0);
    return d;
  }, [scheduleWeek]);

  const scheduleWeekDays = useMemo(() => {
    const arr = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(scheduleWeekStart);
      d.setDate(d.getDate() + i);
      arr.push(d);
    }
    return arr;
  }, [scheduleWeekStart]);

  const renderHeader = (title, showBack, rightSlot) => (
    <div className="header">
      <div className="header-left">
        {showBack && <button className="icon-btn" onClick={goBack}>←</button>}
      </div>
      <div className="header-title">{title}</div>
      <div className="header-right">
        {rightSlot}
        <div className="lang-switch">
          <button className={"lang-btn " + (lang==="ru"?"active":"")} onClick={() => { setLang("ru"); localStorage.setItem(LS.lang,"ru"); }}>RU</button>
          <button className={"lang-btn " + (lang==="en"?"active":"")} onClick={() => { setLang("en"); localStorage.setItem(LS.lang,"en"); }}>EN</button>
        </div>
      </div>
    </div>
  );

  const renderStepIndicator = () => {
    const steps = ["services","doctors","date","time","confirm"];
    const idx = steps.indexOf(screen);
    return (
      <div className="step-indicator">
        {steps.map((s,i) => <div key={s} className={"step-dot " + (i===idx?"active":"") + (i<idx?" done":"")} />)}
      </div>
    );
  };

  if (screen === "home") return (
    <div className="app">
      {notification && (
        <div className="notification-banner">
          <div className="notif-icon">{notification.icon}</div>
          <div className="notif-content">
            <div className="notif-title">{notification.title}</div>
            <div className="notif-text">{notification.text}</div>
          </div>
          <button className="notif-close" onClick={() => setNotification(null)}>×</button>
        </div>
      )}
      <div className="fade-in">
        <div className="hero">
          <div className="hero-pattern"></div>
          <div className="hero-content">
            <div className="hero-top">
              <div className="hero-logo">🦷</div>
              <div className="hero-badge">{t.synced} ✓</div>
            </div>
            <div className="hero-bottom">
              <h1>{t.clinicName}</h1>
              <p>{t.clinicSub}</p>
            </div>
          </div>
        </div>
        {user && (
          <div className="user-card">
            <div className="avatar">
              {user.photoUrl ? <img src={user.photoUrl} alt="" /> : (user.firstName ? user.firstName[0] : "👤").toUpperCase()}
            </div>
            <div className="user-info">
              <div className="user-name">{t.greeting}, {user.firstName || "Friend"}!</div>
              <div className="user-sub">{user.username ? "@" + user.username : t.welcome}</div>
            </div>
            <button className="icon-btn" onClick={() => setScreen("settings")}>⚙️</button>
          </div>
        )}
        <div className="menu-grid">
          <button className="menu-btn primary" onClick={() => { setBooking({ service:null, doctor:null, date:null, time:null }); setScreen("services"); }}>
            <span className="icon">📅</span><span>{t.bookAppt}</span>
          </button>
          <button className="menu-btn" onClick={() => setScreen("appointments")}>
            <span className="icon">📋</span><span>{t.myAppts}</span>
          </button>
          <button className="menu-btn" onClick={() => { setEditProfile(false); setScreen("profile"); }}>
            <span className="icon">👤</span><span>{t.profile}</span>
          </button>
          <button className="menu-btn" onClick={() => setScreen("info")}>
            <span className="icon">📍</span><span>{t.info}</span>
          </button>
          <button className="menu-btn" onClick={() => setScreen("news")}>
            <span className="icon">🎁</span><span>{t.news}</span>
          </button>
          <button className="menu-btn primary" onClick={openChat}>
            <span className="icon">💬</span><span>{t.contactClinic}</span>
          </button>
          {isAdmin && (
            <button className="menu-btn full" onClick={() => setScreen("admin")}>
              <span className="icon">⚙️</span><span>{t.admin}</span>
            </button>
          )}
        </div>
      </div>
    </div>
  );

  if (screen === "services") return (
    <div className="app">
      {renderHeader(t.selectService, true)}
      {renderStepIndicator()}
      <div className="services-list fade-in">
        {SERVICES.map(s => (
          <div key={s.id} className={"service-card " + (booking.service===s.id?"selected":"")}
            onClick={() => setBooking({ ...booking, service: s.id, doctor: null, time: null })}>
            <div className="service-icon">{s.icon}</div>
            <div className="service-info">
              <div className="service-name">{svcName(s.id)}</div>
              <div className="service-meta">{s.duration} {t.min} · {s.price} {t.rub}</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );

  if (screen === "doctors") return (
    <div className="app">
      {renderHeader(t.selectDoctor, true)}
      {renderStepIndicator()}
      <div className="fade-in">
        <div style={{fontSize:12, color:"var(--hint)", marginBottom:8, fontWeight:600}}>{t.filterByService}</div>
        <div className="filter-row">
          <span className={"chip " + (!serviceFilter?"active":"")} onClick={() => setServiceFilter(null)}>{t.allDoctors}</span>
          {SERVICES.map(s => (
            <span key={s.id} className={"chip " + (serviceFilter===s.id?"active":"")} onClick={() => setServiceFilter(s.id)}>{svcName(s.id)}</span>
          ))}
        </div>
        {filteredDoctors.length === 0 ? (
          <div className="empty-state"><div className="empty-icon">🔍</div><div>{t.noDoctors}</div></div>
        ) : (
          <div className="doctors-list">
            {filteredDoctors.map(d => (
              <div key={d.id} className={"doctor-card " + (booking.doctor===d.id?"selected":"")}
                onClick={() => setBooking({ ...booking, doctor: d.id, time: null })}>
                <div className="doctor-avatar" style={{background: d.gradient}}>{d.initials}</div>
                <div className="doctor-info">
                  <div className="doctor-name">{d.name[lang]}</div>
                  <div className="doctor-spec">{d.spec[lang]}</div>
                  <div className="doctor-rating">⭐ {d.rating} · {d.reviews} {t.reviews}</div>
                  <div className="doctor-tags">
                    {d.services.slice(0,3).map(sid => <span key={sid} className="doctor-tag">{svcName(sid)}</span>)}
                  </div>
                </div>
              </div>
            ))}

        )}
      </div>
    </div>
  );

  return <div className="app"><div>Loading...</div></div>;
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
} catch (e) {
  document.getElementById("root").innerHTML = "<div style='padding:20px;color:red'>Error: " + e.message + "</div>";
  console.error(e);
}
</script>
</body>
</html>
